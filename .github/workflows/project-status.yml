name: Project Status

on:
  repository_dispatch:
    types: [project-status]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number
        required: true
        type: number
      decision:
        description: Project Status decision
        required: true
        type: choice
        options: ['ready-for-build', 'undo-done']
      rationale:
        description: Short rationale for the decision
        required: false
        type: string
      reviewer:
        description: Reviewer identity; defaults to github.actor
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: project-status-${{ github.event.inputs.issue_number || github.event.client_payload.issue_number || 'dispatch' }}
  cancel-in-progress: false

jobs:
  execute:
    name: Set Ready for Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out helper
        uses: actions/checkout@v7

      - name: Update DUUMBI Project Status
        id: decision
        uses: actions/github-script@v9
        env:
          GH_PROJECT_PAT: ${{ secrets.GH_PROJECT_PAT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_REVIEW_CHANNEL_ID: ${{ secrets.SLACK_REVIEW_CHANNEL_ID }}
          DUUMBI_PROJECT_NUMBER: ${{ vars.DUUMBI_PROJECT_NUMBER }}
          DUUMBI_PROJECT_OWNER: ${{ vars.DUUMBI_PROJECT_OWNER || github.repository_owner }}
          DUUMBI_PROJECT_OWNER_TYPE: ${{ vars.DUUMBI_PROJECT_OWNER_TYPE }}
          DUUMBI_METRICS_PATH: duumbi-workflow-metrics.json
        with:
          script: |
            const fs = require("fs");
            const mod = await import(`${process.env.GITHUB_WORKSPACE}/scripts/github-actions/project-status.mjs`);
            const recorded = await mod.runProjectStatusJob({
              github,
              context,
              core,
              env: process.env,
              fetchImpl: globalThis.fetch,
              fs,
            });
            core.setOutput("issue_number", String(recorded.inputs?.issueNumber || ""));
            core.setOutput("decision", recorded.inputs?.decision || "");
            core.setOutput("outcome", recorded.outcome || "failed");

      - name: Upload DUUMBI workflow metrics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: duumbi-workflow-metrics-project-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: duumbi-workflow-metrics.json
          if-no-files-found: warn
