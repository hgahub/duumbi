[workspace]
members = [".", "crates/duumbi-studio"]

[package]
name = "duumbi"
version = "0.4.1-preview"
edition = "2024"
license = "MPL-2.0"
default-run = "duumbi"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
thiserror = "2.0.20"
petgraph = "0.8.3"
cranelift-codegen = "0.135.2"
cranelift-frontend = "0.135.2"
cranelift-module = "0.135.2"
cranelift-object = "0.135.2"
target-lexicon = "0.13.5"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "signal", "net", "io-util", "time"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
ratatui = { version = "0.30.2", features = ["crossterm"] }
ratatui-textarea = "0.9.2"
crossterm = "0.29.0"
pulldown-cmark = "0.13.4"
futures-util = "0.3.34"
serde_yaml = "0.9.34"
tempfile = "3.27.0"
sha2 = "0.11.0"
semver = "1.0.28"
flate2 = "1.1.10"
tar = "0.4.46"
dirs = "7.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
owo-colors = "4.4.0"
indicatif = "0.18.6"
comfy-table = "8.0.0"
clap_complete = "4.6.9"
strsim = "0.11.1"
shlex = "2.0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
axum = "0.8.9"
duumbi-registry = { git = "https://github.com/hgahub/duumbi-registry.git", rev = "a3adef41242229feaf00f5352fee7d7a7c5891ce" }
rustls = { version = "0.23.44", default-features = false }
wiremock = "0.6.5"
